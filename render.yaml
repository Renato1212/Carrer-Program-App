# One-click always-on deployment (Render.com free tier).
# Unlike serverless hosting, this keeps a persistent process running, which
# enables the background warmer (fast responses), the intraday repricing
# monitor, a persistent journal database, and live Rithmic connections
# directly from the web app - no local install needed.
services:
  - type: web
    name: edgedesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && (pip install async_rithmic || true)
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/playbooks
