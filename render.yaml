# One-click always-on deployment (Render.com free tier).
# Persistent process = background warmer (fast loads), intraday repricing
# monitor, persistent journal/sim account, and live Rithmic connections
# directly from the web app - no local install needed.
services:
  - type: web
    name: edgedesk
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && (pip install async_rithmic || true)
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/playbooks
    envVars:
      # async_rithmic/protobuf needs <=3.12; Render's default 3.13 breaks the build
      - key: PYTHON_VERSION
        value: 3.12.7
